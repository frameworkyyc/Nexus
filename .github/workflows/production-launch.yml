# Nexus v1.0 production launch: final staging export, production backup, data migration, integrity validation and promotion of the previously verified Worker version.
# Starts only from a push to the dedicated branch release/preflight whose head commit message contains a trigger word, so the ordinary pre-flight pushes never reach it:
#   [launch-rehearsal]   everything up to and including the migration SQL, on local copies. Writes NOTHING to production and deploys nothing.
#   [launch-production]  the same, then the live migration, live verification and promotion of the pinned Worker version, with automatic rollback.
# Safeguards, in order (any failure stops the run; rollback steps run on failure):
#   1 credentials and permissions are checked first        6 the SQL is built and rehearsed on a copy; counts must equal the approved plan (EXPECTED_ROWS)
#   2 production must be in its verified empty state        7 live apply is atomic (`d1 execute --file`); live counts and foreign_key_check must equal the rehearsal
#   3 a Time Travel bookmark is recorded before any write   8 on failure: unchanged check -> rollback.sql -> Time Travel restore to the bookmark
#   4 staging is exported twice and must be identical        9 only the pinned, already pre-flighted version is deployed; live checks must pass, otherwise the previous deployment is restored
#   5 the pinned version must still match the pre-flighted code
# Data never leaves the runner: no exports or SQL are uploaded as artifacts (this repository is public); logs and the summary carry counts only.
# Secrets: the Cloudflare token and account id in the GitHub Environment `production-preflight` (token needs Workers Scripts Edit and D1 Edit). Production Worker secrets stay in Cloudflare.
name: Production launch (migration and release)

on:
  push:
    branches: ['release/preflight']

permissions:
  contents: read

concurrency:
  group: production-launch
  cancel-in-progress: false

env:
  EXPECTED_ROWS: '1234'
  TARGET_VERSION: '21f40bde-631a-4d13-b61b-62c5bf55286d'
  PREFLIGHT_COMMIT: 'e3eb19ff6a037140f1039b952cb423ef41b1036b'
  PRODUCTION_DB: 'nexus-production'
  STAGING_DB: 'nexus-staging'
  LIVE_URL: 'https://nexus.frameworktools.ca'
  WORKERS_SUBDOMAIN: 'plain-poetry-2054'

jobs:
  launch:
    if: github.repository == 'frameworkyyc/Nexus' && github.ref == 'refs/heads/release/preflight' && (contains(github.event.head_commit.message, '[launch-rehearsal]') || contains(github.event.head_commit.message, '[launch-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-preflight
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Mode and credentials
        run: |
          mkdir -p "$RUNNER_TEMP/w"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          if echo "$COMMIT_MESSAGE" | grep -q '\[launch-production\]'; then echo "LIVE=yes" >> "$GITHUB_ENV"; echo "Mode: LIVE LAUNCH"; else echo "LIVE=no" >> "$GITHUB_ENV"; echo "Mode: rehearsal (no production writes)"; fi
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID missing in the production-preflight environment"; exit 1; }
          grep -q 'd3f3ed8d-618b-4f00-82e3-52bfefae1245' wrangler.jsonc || { echo "::error::wrangler.jsonc does not name the production database"; exit 1; }

      - name: Pinned version still matches the pre-flighted code
        run: |
          changed=$(git diff --name-only "$PREFLIGHT_COMMIT" HEAD -- src ':!src/**/__tests__/**' index.html public wrangler.jsonc migrations package.json package-lock.json vite.config.ts tsconfig.json || true)
          if [ -n "$changed" ]; then echo "::error::Application code changed since the pre-flighted version:"; echo "$changed"; exit 1; fi
          echo "No application code changed since the pre-flight of version $TARGET_VERSION."

      - name: Check permissions (read-only) and record the current deployment
        run: |
          set -e
          wrangler d1 time-travel info "$PRODUCTION_DB" --json > "$RUNNER_TEMP/w/bookmark.json"
          echo "BOOKMARK=$(node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(j.bookmark)' "$RUNNER_TEMP/w/bookmark.json")" >> "$GITHUB_ENV"
          wrangler versions list --json > "$RUNNER_TEMP/w/versions.json"
          node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(!v.some(x=>x.id===process.env.TARGET_VERSION)){console.error("::error::Pinned version not found");process.exit(1)}' "$RUNNER_TEMP/w/versions.json"
          wrangler deployments list --json > "$RUNNER_TEMP/w/deployments.json"
          PREV=$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const last=[...d].sort((a,b)=>String(a.created_on).localeCompare(String(b.created_on))).pop();console.log(last.versions[0].version_id)' "$RUNNER_TEMP/w/deployments.json")
          echo "PREVIOUS_VERSION=$PREV" >> "$GITHUB_ENV"
          echo "Recovery bookmark recorded; previous live version $PREV; target $TARGET_VERSION"

      - name: Production must be in its verified empty state
        run: |
          wrangler d1 execute "$PRODUCTION_DB" --remote --json --command "SELECT (SELECT count(*) FROM projects) AS projects, (SELECT count(*) FROM companies) AS companies, (SELECT count(*) FROM purchase_orders) AS purchase_orders, (SELECT count(*) FROM user_roles) AS members, (SELECT count(*) FROM user_projects) AS assignments, (SELECT count(*) FROM auth_sessions) AS sessions, (SELECT count(*) FROM change_log) AS change_log, (SELECT coalesce(sum(version),0) FROM module_versions) AS counters, (SELECT count(*) FROM d1_migrations) AS ledger" > "$RUNNER_TEMP/w/pre.json"
          node scripts/launch-guard.mjs prestate "$RUNNER_TEMP/w/pre.json"

      - name: Final staging export (twice; staging must not change) and production backup
        run: |
          set -e
          cd "$RUNNER_TEMP/w"
          wrangler d1 export "$STAGING_DB" --remote --output staging-1.sql
          sleep 20
          wrangler d1 export "$STAGING_DB" --remote --output staging-2.sql
          if ! cmp -s staging-1.sql staging-2.sql; then echo "::error::Staging changed between two exports. Keep it frozen and run again."; exit 1; fi
          wrangler d1 export "$PRODUCTION_DB" --remote --output production-before.sql
          echo "Staging unchanged across two exports; production backup taken ($(wc -c < production-before.sql) bytes)."

      - name: Load exports into local copies, dry run, rehearsal, build SQL
        run: |
          set -e
          cd "$RUNNER_TEMP/w"
          S="$GITHUB_WORKSPACE/scripts"
          node $S/data-migration/import-sql.mjs staging-1.sql staging.sqlite
          node $S/data-migration/import-sql.mjs production-before.sql production.sqlite
          node $S/data-migration/migrate.mjs --source staging.sqlite --target production.sqlite --groups construction,materials,fleet --dry-run --report dry-run.json
          node $S/launch-guard.mjs report dry-run.json "$EXPECTED_ROWS"
          cp production.sqlite rehearsal.sqlite
          node $S/data-migration/migrate.mjs --source staging.sqlite --target rehearsal.sqlite --groups construction,materials,fleet --apply --emit-sql migration.sql --emit-rollback rollback.sql --emit-verify verify.sql
          (cd "$GITHUB_WORKSPACE" && MIGRATION_SOURCE_DB="$RUNNER_TEMP/w/staging.sqlite" MIGRATION_TARGET_DB="$RUNNER_TEMP/w/rehearsal.sqlite" MIGRATION_EXPECT_EQUAL=construction,materials,fleet npx vitest run src/worker/__tests__/dataMigrationCopies.test.ts)
          node $S/launch-guard.mjs counts rehearsal.sqlite verify.sql.expected.json > expected-counts.json
          # the file must be INSERT-only apart from the three counter updates
          if grep -Ev '^(INSERT INTO|UPDATE "?module_versions"?|--|$|PRAGMA)' migration.sql | head -3 | grep -q .; then echo "::error::migration.sql contains statements other than INSERT / module counter updates"; exit 1; fi
          echo "Rehearsal passed; $(wc -c < migration.sql) bytes of SQL ready."

      - name: LIVE migration (atomic) and verification
        if: env.LIVE == 'yes'
        id: migrate
        run: |
          set -e
          cd "$RUNNER_TEMP/w"
          echo "started=yes" >> "$GITHUB_OUTPUT"
          wrangler d1 execute "$PRODUCTION_DB" --remote --yes --file=migration.sql > apply.log 2>&1 || { tail -5 apply.log; exit 1; }
          echo "Applied. Verifying."
          wrangler d1 execute "$PRODUCTION_DB" --remote --yes --json --file=verify.sql > verify.json
          node "$GITHUB_WORKSPACE/scripts/launch-guard.mjs" compare verify.json expected-counts.json
          echo "verified=yes" >> "$GITHUB_OUTPUT"

      - name: Roll back the data if the migration failed or did not verify
        if: failure() && steps.migrate.outputs.started == 'yes' && steps.migrate.outputs.verified != 'yes'
        run: |
          cd "$RUNNER_TEMP/w"
          W="wrangler"
          q() { $W d1 execute "$PRODUCTION_DB" --remote --yes --json --command "SELECT (SELECT count(*) FROM projects) AS projects, (SELECT count(*) FROM companies) AS companies, (SELECT count(*) FROM purchase_orders) AS purchase_orders, (SELECT count(*) FROM user_roles) AS members, (SELECT count(*) FROM user_projects) AS assignments, (SELECT count(*) FROM auth_sessions) AS sessions, (SELECT count(*) FROM change_log) AS change_log, (SELECT coalesce(sum(version),0) FROM module_versions) AS counters, (SELECT count(*) FROM d1_migrations) AS ledger" > after.json && node "$GITHUB_WORKSPACE/scripts/launch-guard.mjs" prestate after.json; }
          if q; then echo "::warning::Production is unchanged (the atomic apply left nothing behind)."; exit 0; fi
          echo "::warning::Partial or unverified data: running rollback.sql"
          if $W d1 execute "$PRODUCTION_DB" --remote --yes --file=rollback.sql > rb.log 2>&1 && q; then echo "::warning::Rolled back with rollback.sql; production is empty again."; exit 0; fi
          echo "::error::rollback.sql did not restore the empty state: restoring the Time Travel bookmark $BOOKMARK"
          $W d1 time-travel restore "$PRODUCTION_DB" --bookmark="$BOOKMARK" --yes
          q && echo "::warning::Restored from the bookmark; production is empty again." || { echo "::error::MANUAL ACTION: production is not in its original state. Bookmark: $BOOKMARK"; exit 1; }

      - name: Pre-flight the pinned version again
        if: env.LIVE == 'yes'
        run: node scripts/preflight.mjs "https://${TARGET_VERSION%%-*}-nexus.${WORKERS_SUBDOMAIN}.workers.dev"

      - name: LIVE deploy of the pinned, pre-flighted version
        if: env.LIVE == 'yes'
        id: deploy
        run: |
          echo "started=yes" >> "$GITHUB_OUTPUT"
          wrangler versions deploy "${TARGET_VERSION}@100%" --yes --message "Nexus v1.0 launch: data migrated, pre-flighted version"

      - name: Live checks (with retries)
        if: env.LIVE == 'yes'
        run: |
          for i in $(seq 1 12); do
            if node scripts/preflight.mjs "$LIVE_URL" > "$RUNNER_TEMP/w/live.log" 2>&1; then cat "$RUNNER_TEMP/w/live.log"; echo "Live site passed after $i attempt(s)."; exit 0; fi
            sleep 10
          done
          cat "$RUNNER_TEMP/w/live.log"; exit 1

      - name: Restore the previous deployment if the release failed
        if: failure() && steps.deploy.outputs.started == 'yes'
        run: |
          echo "::error::Release checks failed: restoring version $PREVIOUS_VERSION. The migrated data is kept (it passed verification)."
          wrangler rollback "$PREVIOUS_VERSION" --yes --message "automatic rollback: live checks failed"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production launch: $([ "$LIVE" = yes ] && echo LIVE || echo rehearsal)"
            echo "- Result: **${{ job.status }}**"
            echo "- Time Travel bookmark taken before any write: \`${BOOKMARK:-none}\`"
            echo "- Previous live version: \`${PREVIOUS_VERSION:-unknown}\`; pinned release version: \`$TARGET_VERSION\`"
            echo "- Approved rows: $EXPECTED_ROWS"
            [ -f "$RUNNER_TEMP/w/dry-run.json" ] && node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log("- Dry run: "+r.plan.reduce((s,t)=>s+t.migrate,0)+" rows in "+r.plan.filter(t=>t.migrate).length+" tables, "+r.problems.length+" problems, "+r.checks.length+" checks")' "$RUNNER_TEMP/w/dry-run.json" || true
          } >> "$GITHUB_STEP_SUMMARY"
